name: quality-and-security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -r requirements.lock &&
          python -m pip install --no-deps -e ".[dev]"
      - name: Tests
        shell: bash
        run: |
          set +e
          python -m pytest -vv --cov=app --cov-report=term-missing --cov-fail-under=70 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(tail -40 pytest.log | tr '\n' ' ')
            echo "::error title=pytest::${summary}"
          fi
          exit "$status"
      - name: Ruff
        run: ruff check app migrations tests
      - name: Type checking
        run: >-
          mypy --follow-imports=skip --ignore-missing-imports
          app/services/text_normalization.py app/services/fingerprint.py
          app/services/google_safe_browsing.py app/services/rules.py
          app/services/retrohunt.py app/services/threat_intel.py
      - name: Bandit
        run: bandit -r app -ll
      - name: Dependency audit
        run: pip install pip-audit && pip-audit
      - name: Semgrep baseline
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag alerta-clara:ci .
      - name: Filesystem vulnerability scan
        uses: anchore/scan-action@v7
        id: grype
        with:
          image: alerta-clara:ci
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: grype.json
      - name: Enforce container vulnerability cutoff
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("grype.json").read_text(encoding="utf-8"))
          findings = [
              match
              for match in report.get("matches", [])
              if match.get("vulnerability", {}).get("severity") in {"High", "Critical"}
          ]

          # El corte se aplica solo a lo que se puede corregir. Bloquear por CVE sin
          # parche publicado deja el build permanentemente en rojo por algo sobre lo
          # que no se puede actuar, y un semáforo que nunca se pone verde acaba
          # ignorándose. Las no corregibles se anotan igualmente para tenerlas a la vista.
          accionables = []
          sin_parche = []
          for match in findings:
              vulnerability = match.get("vulnerability", {})
              artifact = match.get("artifact", {})
              versions = vulnerability.get("fix", {}).get("versions", [])
              fixes = ", ".join(versions) or "sin parche"
              message = (
                  f"{vulnerability.get('id', 'desconocido')} "
                  f"{artifact.get('name', 'desconocido')}@{artifact.get('version', '?')} "
                  f"({vulnerability.get('severity')}); fix: {fixes}"
              )
              if versions:
                  accionables.append(message)
                  print(f"::error title=container-vulnerability::{message}")
              else:
                  sin_parche.append(message)
                  print(f"::warning title=container-vulnerability-unfixed::{message}")

          print(
              f"high/critical: {len(findings)} "
              f"({len(accionables)} con parche, {len(sin_parche)} sin parche)"
          )
          if accionables:
              raise SystemExit(
                  f"{len(accionables)} vulnerabilidad(es) high/critical con parche disponible"
              )
          print("Sin vulnerabilidades high/critical corregibles en la imagen")
          PY
