services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://alerta:${POSTGRES_PASSWORD:-alerta-dev}@db:5432/alerta
      REDIS_URL: redis://redis:6379/0
      BROWSER_SCANNER_URL: http://scanner:8090
      BROWSER_SCANNER_TOKEN: ${BROWSER_SCANNER_TOKEN:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12,127.0.0.1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 4s
      retries: 5
    networks: [backend, scanner_api]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alerta
      POSTGRES_USER: alerta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alerta-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerta -d alerta"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  scanner:
    build: ./scanner
    profiles: ["browser"]
    restart: unless-stopped
    environment:
      SCANNER_TOKEN: ${BROWSER_SCANNER_TOKEN:-}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    expose: ["8090"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 20s
      timeout: 4s
      retries: 5
    networks: [scanner_api, scan_egress]

  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
  scanner_api:
    internal: true
  scan_egress:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
